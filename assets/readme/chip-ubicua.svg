<rect x="15" y="18" width="2" height="2" fill="#b07a43"/>
<rect x="13" y="20" width="2" height="2" fill="#b07a43"/>
<text class="t" x="34" y="22" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start">Computación Ubicua</text></svg>
