<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Trayectoria: 2023 ingreso a Ingeniería de Software en la Universidad Cooperativa; 2024 estructuras de datos en Python; 2025 BlackJack Royale, CineX y Computación Ubicua; 2026 Numi y Casa Rendón con cliente real. Siguiente: práctica empresarial. 2027: fin de la carrera, previsto."><title>Trayectoria</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1033"/><stop offset=".6" stop-color="#2a1245"/><stop offset="1" stop-color="#3a1646"/></linearGradient><style>
.t{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
.s{animation:tw 3s steps(2,end) infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.f{animation:flt 3.2s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.b{animation:rip 2.6s ease-in-out infinite}
@keyframes rip{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.s,.f,.b,.cur{animation:none}}
</style></defs><rect width="400" height="520" fill="url(#bg)"/>
