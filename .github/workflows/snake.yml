name: Gráfica de contribuciones

on:
  schedule:
    - cron: "0 6 * * *" # todos los días, 1:00 a. m. en Colombia
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar la gráfica
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#d9568a&color_dots=#ebedf0,#e9d5ff,#c4a1f0,#9b6bd6,#6b3fa0
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff8fb8&color_dots=#2a1245,#4a2c7a,#7b3fa0,#c05cc0,#ff8fb8

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
