name: Gráfica de contribuciones

on:
  schedule:
    - cron: "0 6 * * *" # todos los días, 1:00 a. m. en Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/contribuciones.py", ".github/workflows/contribuciones.yml"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Dibujar la pared de mina con las contribuciones
        run: python3 tools/contribuciones.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
